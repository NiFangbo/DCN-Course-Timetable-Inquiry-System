<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>课程表查询系统</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>课程表查询系统</h1>
        <p>网页端 GUI，可直接查询课程并管理课程数据。</p>
      </header>

      <section class="card">
        <h2>课程查询</h2>
        <form id="query-form" class="grid">
          <label>
            查询方式
            <select id="query-type">
              <option value="code">课程代码</option>
              <option value="instructor">教师</option>
              <option value="semester">学期</option>
            </select>
          </label>
          <label>
            关键字
            <input id="query-value" type="text" placeholder="例如：COMP3003" />
          </label>
          <div class="actions">
            <button type="submit">查询</button>
            <button type="button" id="list-all">列出全部</button>
          </div>
        </form>
      </section>

      <section class="card">
        <h2>查询结果</h2>
        <div id="status" class="status"></div>
        <div class="table-wrapper">
          <table id="results-table">
            <thead>
              <tr>
                <th>代码</th>
                <th>课程名称</th>
                <th>班级</th>
                <th>教师</th>
                <th>时间</th>
                <th>教室</th>
                <th>学期</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section class="card">
        <h2>管理员操作</h2>
        <p class="muted">管理员操作需要账号密码，默认账号见 config/admins.txt。</p>
        <div class="grid admin-grid">
          <label>
            管理员账号
            <input id="admin-user" type="text" placeholder="admin" />
          </label>
          <label>
            管理员密码
            <input id="admin-pass" type="password" placeholder="admin123" />
          </label>
        </div>
        <div id="admin-status" class="status"></div>

        <div class="admin-actions">
          <form id="add-form" class="card sub-card">
            <h3>新增课程</h3>
            <div class="grid">
              <label>代码<input id="add-code" type="text" /></label>
              <label>名称<input id="add-title" type="text" /></label>
              <label>班级<input id="add-section" type="text" /></label>
              <label>教师<input id="add-instructor" type="text" /></label>
              <label>时间<input id="add-time" type="text" /></label>
              <label>教室<input id="add-classroom" type="text" /></label>
              <label>学期<input id="add-semester" type="text" /></label>
            </div>
            <div class="actions">
              <button type="submit">新增</button>
            </div>
          </form>

          <form id="update-form" class="card sub-card">
            <h3>更新课程</h3>
            <div class="grid">
              <label>代码<input id="update-code" type="text" /></label>
              <label>
                字段
                <select id="update-field">
                  <option value="title">title</option>
                  <option value="section">section</option>
                  <option value="instructor">instructor</option>
                  <option value="time">time</option>
                  <option value="classroom">classroom</option>
                  <option value="semester">semester</option>
                </select>
              </label>
              <label>新值<input id="update-value" type="text" /></label>
            </div>
            <div class="actions">
              <button type="submit">更新</button>
            </div>
          </form>

          <form id="delete-form" class="card sub-card">
            <h3>删除课程</h3>
            <div class="grid">
              <label>代码<input id="delete-code" type="text" /></label>
            </div>
            <div class="actions">
              <button type="submit" class="danger">删除</button>
            </div>
          </form>
        </div>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
