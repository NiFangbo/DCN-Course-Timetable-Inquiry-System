<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User - Timetable Inquiry</title>
    <link rel="stylesheet" href="app.css">
    <style>
                .log-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1e1e2e;
            color: #cdd6f4;
            font-family: 'Consolas', monospace;
            font-size: 12px;
            border-top: 2px solid #313244;
            z-index: 1000;
            transition: all 0.3s ease;
        }
        
        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background: #313244;
            cursor: pointer;
            user-select: none;
        }
        
        .log-header h3 {
            margin: 0;
            font-size: 14px;
            font-weight: 500;
        }
        
        .log-header button {
            background: transparent;
            color: #cdd6f4;
            border: 1px solid #45475a;
            padding: 4px 12px;
            font-size: 11px;
        }
        
        .log-content {
            max-height: 200px;
            overflow-y: auto;
            padding: 8px 16px;
            background: #1e1e2e;
        }
        
        .log-entry {
            padding: 4px 0;
            border-bottom: 1px solid #313244;
            font-family: monospace;
            font-size: 11px;
            line-height: 1.4;
            word-break: break-all;
        }
        
        .log-entry.info { color: #89b4fa; }
        .log-entry.warn { color: #f9e2af; }
        .log-entry.error { color: #f38ba8; }
        
        .log-panel.collapsed .log-content {
            display: none;
        }
        
        /* Add padding to body to prevent content being hidden under log panel */
        body {
            padding-bottom: 250px;
        }
        
        body.log-collapsed {
            padding-bottom: 50px;
        }
    </style>
</head>
<script src="log-panel.js"></script>
<body>
    <div class="container">
        <header>
            <h1>Timetable Inquiry System</h1>
            <p>User Mode - Query Only</p>
        </header>

        <div class="card">
            <h2>Query Courses</h2>
            <form id="query-form" class="grid">
                <label>
                    Query Type
                    <select id="query-type">
                        <option value="code">Course Code</option>
                        <option value="instructor">Instructor</option>
                        <option value="semester">Semester</option>
                    </select>
                </label>
                <label>
                    Keyword
                    <input id="query-value" type="text" placeholder="e.g., COMP3003">
                </label>
                <div class="actions">
                    <button type="submit">Search</button>
                    <button type="button" id="list-all">List All</button>
                </div>
            </form>
        </div>

        <div class="card">
            <h2>Results</h2>
            <div id="status" class="status"></div>
            <div class="table-wrapper">
                <table id="results-table">
                    <thead>
                        <tr>
                            <th>Code</th>
                            <th>Title</th>
                            <th>Section</th>
                            <th>Instructor</th>
                            <th>Time</th>
                            <th>Classroom</th>
                            <th>Semester</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div class="actions">
            <button id="back-btn">Back to Mode Selection</button>
        </div>
    </div>

    <div class="log-panel" id="log-panel">
        <div class="log-header">
            <h3>Server Logs <span id="log-count"></span></h3>
            <div>
                <button id="log-clear-btn">Clear</button>
                <button id="log-toggle-btn">Collapse</button>
            </div>
        </div>
        <div class="log-content" id="log-content">
            <div class="log-entry">Waiting for logs...</div>
        </div>
    </div>

    <script src="user.js"></script>
</body>
</html>
